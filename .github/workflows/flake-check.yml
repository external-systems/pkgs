# Org reusable workflow: `nix flake check` with a warm Nix store.
#
# Caller (see templates/default/.github/workflows/ci.yml):
#
#   jobs:
#     check:
#       uses: external-systems/pkgs/.github/workflows/flake-check.yml@main
#       permissions: {contents: read, actions: write}
#       secrets: inherit
#
# The status check this produces is named "check / flake-check" (caller
# job id / this job id). That is the context to require in a ruleset.
#
# Who can run it: pull requests run only for the owner, org members,
# collaborators and the bots listed in `trusted-bots`. Anyone else's PR
# FAILS this job (it is not skipped: a skipped required check counts as
# passing). Never call this from pull_request_target.
#
# Private flake inputs: set NIX_GITHUB_TOKEN, or NIX_APP_ID +
# NIX_APP_PRIVATE_KEY, as repository (or org) secrets. See
# documentation/docs/ci.md.
name: flake-check

on:
  workflow_call:
    inputs:
      check-args:
        description: Extra arguments for `nix flake check`.
        type: string
        default: --keep-going --print-build-logs
      trusted-bots:
        description: JSON list of bot logins whose PRs may run the check.
        type: string
        default: '["claude[bot]", "dependabot[bot]", "github-actions[bot]"]'
      private-repos:
        description: >-
          Comma-separated repos (no owner) the GitHub App token may read,
          e.g. "secrets". Used only with NIX_APP_ID / NIX_APP_PRIVATE_KEY.
        type: string
        default: ""
      cachix-name:
        description: Optional Cachix cache to pull from (and push to on main).
        type: string
        default: ""
      gc-max-store-size:
        description: Store size the cache is GC'd down to before saving.
        type: string
        default: 5G
      timeout-minutes:
        type: number
        default: 90
    secrets:
      NIX_GITHUB_TOKEN:
        description: Fine-grained PAT with read-only Contents on the private input repos.
        required: false
      NIX_APP_ID:
        description: GitHub App id; with NIX_APP_PRIVATE_KEY mints a short-lived token instead of a PAT.
        required: false
      NIX_APP_PRIVATE_KEY:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      HAS_APP: ${{ secrets.NIX_APP_ID != '' && secrets.NIX_APP_PRIVATE_KEY != '' }}
      HAS_CACHIX: ${{ inputs.cachix-name != '' }}
    steps:
      # Fail closed for untrusted PR authors. merge_group and push events
      # can only be started by people with write access.
      - name: Trusted author
        if: >-
          github.event_name == 'pull_request' &&
          !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) &&
          !contains(fromJSON(inputs.trusted-bots), github.event.pull_request.user.login)
        run: |
          echo "::error::PR author ${{ github.event.pull_request.user.login }} (${{ github.event.pull_request.author_association }}) is not trusted to run CI here."
          exit 1

      - uses: actions/checkout@v6

      - id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NIX_APP_ID }}
          private-key: ${{ secrets.NIX_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.private-repos }}

      # nix fetches github: inputs through the API, which ignores git
      # credentials, so the token goes in as nix's access-tokens. Without
      # one, github.token still lifts the anonymous API rate limit.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ steps.app-token.outputs.token || secrets.NIX_GITHUB_TOKEN || github.token }}

      - if: env.HAS_CACHIX == 'true'
        uses: cachix/cachix-action@v16
        with:
          name: ${{ inputs.cachix-name }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Push only from main; PRs and the merge queue just pull.
          skipPush: ${{ github.event_name != 'push' }}

      # Nix store cache (GitHub Actions cache, 10 GB per repo).
      #   - Key: <os>-<arch>-<locks>-<nix sources>. On a miss, restore the
      #     newest cache with the same locks (inputs identical, only local
      #     code changed), then the newest cache of any lock.
      #   - Saved only by pushes to main and manual runs. PRs and merge
      #     groups can read main's cache but would write caches nobody
      #     else can read, which only evicts main's.
      #   - GC'd to gc-max-store-size before saving; older main caches are
      #     purged so one current cache remains.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/devenv.lock') }}-${{ hashFiles('**/*.nix') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/devenv.lock') }}-
            nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          gc-max-store-size-linux: ${{ inputs.gc-max-store-size }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: nix flake check
        run: nix flake check ${{ inputs.check-args }}
