# pkgs' own CI: the org workflow (org-ci.yml) by local path, so a PR that
# changes it is tested by that change. Every other repo calls it by full
# path; see templates/default/.github/workflows/ci.yml.
#
# Required status check for the ruleset: "ci / flake-check".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/org-ci.yml
    # The union org-ci's jobs need; each job narrows it to its own.
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write
    with:
      minor: 0
    secrets: inherit
