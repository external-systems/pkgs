# devenv CLI entry for pkgs (devenv shell, auto-activation, devenv up,
# devenv mcp). pkgs owns nixpkgs, so the pin is the flake.lock rev
# itself; checks.lock-sync enforces it and `sync-locks` rewrites it.
# Other repos take nixpkgs from pkgs instead (templates/default).
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010
imports:
  - ./devenv
